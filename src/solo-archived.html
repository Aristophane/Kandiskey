<!-- ═══ SOLO ═══ -->
<div id="solo-wrap">
  <div class="seq-panel">
    <div class="seq-header">
      <span class="seq-lbl">Mode</span>
      <button class="midi-btn solo-mode-btn active" id="solo-mode-chords">Chords</button>
      <button class="midi-btn solo-mode-btn" id="solo-mode-notes">Notes</button>
      <div class="seq-sep"></div>
      <span class="seq-lbl">Oct</span>
      <button class="midi-btn" id="solo-oct-down">−</button>
      <span class="seq-val" id="solo-oct-val">4</span>
      <button class="midi-btn" id="solo-oct-up">+</button>
      <div class="seq-sep"></div>
      <button class="midi-btn" id="btn-solo-synth">🔊 Sound</button>
    </div>
    <canvas id="tonnetz-canvas"></canvas>
  </div>
</div>

<!-- ═══ SOLO SYNTH CONTROLS ═══ -->
<div id="solo-synth-wrap">
  <div class="synth-panel">
    <div class="syn-group" style="min-width:116px">
      <span class="syn-label">Wave</span>
      <div class="wave-grid">
        <canvas class="solo-wave-cvs active" id="solo-wave-sine"     data-wave="sine"     width="52" height="22"></canvas>
        <canvas class="solo-wave-cvs"        id="solo-wave-triangle" data-wave="triangle" width="52" height="22"></canvas>
        <canvas class="solo-wave-cvs"        id="solo-wave-square"   data-wave="square"   width="52" height="22"></canvas>
        <canvas class="solo-wave-cvs"        id="solo-wave-sawtooth" data-wave="sawtooth" width="52" height="22"></canvas>
      </div>
    </div>
    <div class="syn-group">
      <span class="syn-label">Attack</span>
      <span class="syn-val" id="solo-syn-atk-val">10ms</span>
      <input type="range" class="syn-slider" id="solo-syn-attack" min="1" max="500" step="1" value="10">
    </div>
    <div class="syn-group">
      <span class="syn-label">Decay</span>
      <span class="syn-val" id="solo-syn-dec-val">0.50s</span>
      <input type="range" class="syn-slider" id="solo-syn-decay" min="50" max="5000" step="10" value="500">
    </div>
    <div class="syn-group">
      <span class="syn-label">Filter</span>
      <span class="syn-val" id="solo-syn-flt-val">3.5kHz</span>
      <input type="range" class="syn-slider" id="solo-syn-filter" min="200" max="12000" step="50" value="3500">
    </div>
    <div class="syn-group">
      <span class="syn-label">Reso</span>
      <span class="syn-val" id="solo-syn-res-val">1.2</span>
      <input type="range" class="syn-slider" id="solo-syn-res" min="0.1" max="14" step="0.1" value="1.2">
    </div>
    <div class="syn-group">
      <span class="syn-label">Vib Rate</span>
      <span class="syn-val" id="solo-syn-vbr-val">5.5Hz</span>
      <input type="range" class="syn-slider" id="solo-syn-vib-rate" min="0.5" max="12" step="0.1" value="5.5">
    </div>
    <div class="syn-group">
      <span class="syn-label">Vib Depth</span>
      <span class="syn-val" id="solo-syn-vbd-val">0¢</span>
      <input type="range" class="syn-slider" id="solo-syn-vib-depth" min="0" max="60" step="1" value="0">
    </div>
    <div class="syn-group">
      <span class="syn-label">Sustain</span>
      <span class="syn-val" id="solo-syn-sus-val">55%</span>
      <input type="range" class="syn-slider" id="solo-syn-sustain" min="0" max="100" step="1" value="55">
    </div>
    <div class="syn-group">
      <span class="syn-label">Detune</span>
      <span class="syn-val" id="solo-syn-det-val">0¢</span>
      <input type="range" class="syn-slider" id="solo-syn-detune" min="-100" max="100" step="1" value="0">
    </div>
    <div class="syn-group">
      <span class="syn-label">Harmonics</span>
      <span class="syn-val" id="solo-syn-harm-val">6</span>
      <input type="range" class="syn-slider" id="solo-syn-harmonics" min="1" max="8" step="1" value="6">
    </div>
  </div>
</div>
