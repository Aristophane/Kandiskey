name: Deploy Vite Partial (SFTP)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      # 👉 Ensure your custom HTML is inside dist
      - name: Copy custom HTML into dist
        run: cp tooltovisualisemusic.html dist/

      - name: Deploy ONLY selected files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21

          local-dir: ./dist/
          server-dir: /public_html/thermidorSiteVitrine/

          include: |
            tooltovisualisemusic.html
            assets/**

          exclude: |
            **/.git*
            **/node_modules/**
