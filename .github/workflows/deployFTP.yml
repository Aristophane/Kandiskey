name: Deploy Vite Partial (FTPS)

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      # 👉 Create clean deploy folder
      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp tooltovisualisemusic.html deploy/
          cp -r dist/assets deploy/

      # 👉 Deploy ONLY what’s inside /deploy
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21

          local-dir: ./deploy/
          server-dir: /public_html/thermidorSiteVitrine/

          exclude: |
            **/.git*
            **/node_modules/**
