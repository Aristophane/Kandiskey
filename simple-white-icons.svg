<svg xmlns="http://www.w3.org/2000/svg" width="448" height="168" viewBox="0 0 448 168" role="img" aria-labelledby="title desc">
  <title id="title">Simple white music tool icons</title>
  <desc id="desc">Reusable white SVG symbol icons for the music visualizer controls.</desc>

  <defs>
    <symbol id="icon-audio" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13v-2a7 7 0 0 1 14 0v2"/>
        <path d="M5 13v4a2 2 0 0 0 2 2h1v-8H7a2 2 0 0 0-2 2Z"/>
        <path d="M19 13v4a2 2 0 0 1-2 2h-1v-8h1a2 2 0 0 1 2 2Z"/>
      </g>
    </symbol>

    <symbol id="icon-muted" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10v4h4l5 4V6L8 10H4Z"/>
        <path d="M17 9l4 6"/>
        <path d="M21 9l-4 6"/>
      </g>
    </symbol>

    <symbol id="icon-fretboard" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14"/>
        <path d="M5 12h14"/>
        <path d="M5 17h14"/>
        <path d="M8 5v14"/>
        <path d="M14 5v14"/>
      </g>
    </symbol>

    <symbol id="icon-synth" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15c2-5 4-5 6 0s4 5 6 0 4-5 6 0"/>
        <path d="M4 6h16"/>
        <path d="M4 10h10"/>
      </g>
    </symbol>

    <symbol id="icon-sequencer" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5" width="16" height="14" rx="2"/>
        <path d="M9 5v14"/>
        <path d="M15 5v14"/>
        <path d="M4 10h16"/>
        <path d="M4 15h16"/>
      </g>
    </symbol>

    <symbol id="icon-drums" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="14" rx="7" ry="4"/>
        <path d="M5 14v3c0 2.2 3.1 4 7 4s7-1.8 7-4v-3"/>
        <path d="M9 8 5 4"/>
        <path d="M15 8l4-4"/>
      </g>
    </symbol>

    <symbol id="icon-mixer" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 4v16"/>
        <path d="M12 4v16"/>
        <path d="M18 4v16"/>
        <circle cx="6" cy="9" r="2"/>
        <circle cx="12" cy="15" r="2"/>
        <circle cx="18" cy="11" r="2"/>
      </g>
    </symbol>

    <symbol id="icon-tuner" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4v6a2 2 0 0 1-4 0V4"/>
        <path d="M16 4v6a2 2 0 0 0 4 0V4"/>
        <path d="M8 4h8"/>
        <path d="M12 10v10"/>
        <path d="M10 20h4"/>
      </g>
    </symbol>

    <symbol id="icon-play" viewBox="0 0 24 24">
      <path fill="#fff" d="M8 5.8v12.4c0 .7.8 1.1 1.4.7l9-6.2c.5-.3.5-1.1 0-1.4l-9-6.2c-.6-.4-1.4 0-1.4.7Z"/>
    </symbol>

    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="1.5" fill="#fff"/>
    </symbol>

    <symbol id="icon-prev" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6l-6 6 6 6"/>
        <path d="M9 12h11"/>
      </g>
    </symbol>

    <symbol id="icon-next" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
        <path d="M4 12h11"/>
      </g>
    </symbol>

    <symbol id="icon-melody" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 5v10.5a3.5 3.5 0 1 1-1.8-3.1"/>
        <path d="M14 5h5v4h-5"/>
      </g>
    </symbol>

    <symbol id="icon-reverb" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h2"/>
        <path d="M10 8c1.4 1 1.4 7 0 8"/>
        <path d="M14 6c2.2 2.1 2.2 9.9 0 12"/>
        <path d="M18 4c3 3.3 3 12.7 0 16"/>
      </g>
    </symbol>

    <symbol id="icon-drive" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 3 5 14h6l-1 7 9-12h-6l1-6Z"/>
      </g>
    </symbol>

    <symbol id="icon-delay" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"/>
        <path d="M12 7v5l3 2"/>
      </g>
    </symbol>

    <symbol id="icon-feedback" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 7h8a4 4 0 0 1 0 8H6"/>
        <path d="M9 11 5 15l4 4"/>
      </g>
    </symbol>

    <symbol id="icon-filter" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 6h14l-5 6v5l-4 2v-7L5 6Z"/>
      </g>
    </symbol>

    <symbol id="icon-cutoff" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16h4c3.5 0 4.5-8 8-8h4"/>
        <path d="M16 5v14"/>
      </g>
    </symbol>

    <symbol id="icon-resonance" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16h5l3-9 3 9h5"/>
        <path d="M12 7v-3"/>
      </g>
    </symbol>

    <symbol id="icon-attack" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 18 17 6"/>
        <path d="M17 6v7"/>
        <path d="M17 6h-7"/>
      </g>
    </symbol>

    <symbol id="icon-decay" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 6 17 18"/>
        <path d="M17 18v-7"/>
        <path d="M17 18h-7"/>
      </g>
    </symbol>

    <symbol id="icon-vibrato-rate" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0"/>
        <path d="M4 18h3"/>
        <path d="M17 18h3"/>
      </g>
    </symbol>

    <symbol id="icon-vibrato-depth" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h16"/>
        <path d="M8 8 4 12l4 4"/>
        <path d="M16 8l4 4-4 4"/>
      </g>
    </symbol>
  </defs>

  <rect width="448" height="168" rx="8" fill="#0b0b18"/>
  <g font-family="Arial, sans-serif" font-size="6" fill="#fff" opacity=".72" text-anchor="middle">
    <g transform="translate(12 12)"><use href="#icon-audio" width="24" height="24"/><text x="12" y="35">audio</text></g>
    <g transform="translate(76 12)"><use href="#icon-muted" width="24" height="24"/><text x="12" y="35">muted</text></g>
    <g transform="translate(140 12)"><use href="#icon-fretboard" width="24" height="24"/><text x="12" y="35">fret</text></g>
    <g transform="translate(204 12)"><use href="#icon-synth" width="24" height="24"/><text x="12" y="35">synth</text></g>
    <g transform="translate(268 12)"><use href="#icon-sequencer" width="24" height="24"/><text x="12" y="35">seq</text></g>
    <g transform="translate(332 12)"><use href="#icon-drums" width="24" height="24"/><text x="12" y="35">drums</text></g>
    <g transform="translate(396 12)"><use href="#icon-mixer" width="24" height="24"/><text x="12" y="35">mixer</text></g>

    <g transform="translate(12 66)"><use href="#icon-play" width="24" height="24"/><text x="12" y="35">play</text></g>
    <g transform="translate(76 66)"><use href="#icon-stop" width="24" height="24"/><text x="12" y="35">stop</text></g>
    <g transform="translate(140 66)"><use href="#icon-prev" width="24" height="24"/><text x="12" y="35">prev</text></g>
    <g transform="translate(204 66)"><use href="#icon-next" width="24" height="24"/><text x="12" y="35">next</text></g>
    <g transform="translate(268 66)"><use href="#icon-melody" width="24" height="24"/><text x="12" y="35">melody</text></g>
    <g transform="translate(332 66)"><use href="#icon-reverb" width="24" height="24"/><text x="12" y="35">reverb</text></g>
    <g transform="translate(396 66)"><use href="#icon-drive" width="24" height="24"/><text x="12" y="35">drive</text></g>

    <g transform="translate(12 120)"><use href="#icon-delay" width="24" height="24"/><text x="12" y="35">delay</text></g>
    <g transform="translate(76 120)"><use href="#icon-feedback" width="24" height="24"/><text x="12" y="35">feedback</text></g>
    <g transform="translate(140 120)"><use href="#icon-filter" width="24" height="24"/><text x="12" y="35">filter</text></g>
    <g transform="translate(204 120)"><use href="#icon-cutoff" width="24" height="24"/><text x="12" y="35">cutoff</text></g>
    <g transform="translate(268 120)"><use href="#icon-resonance" width="24" height="24"/><text x="12" y="35">reso</text></g>
    <g transform="translate(332 120)"><use href="#icon-attack" width="24" height="24"/><text x="12" y="35">attack</text></g>
    <g transform="translate(396 120)"><use href="#icon-decay" width="24" height="24"/><text x="12" y="35">decay</text></g>
  </g>
</svg>
