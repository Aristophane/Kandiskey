# Nginx config for the Kandisky sync server
# Place at: /etc/nginx/sites-available/kandisky-sync
# Enable: ln -s /etc/nginx/sites-available/kandisky-sync /etc/nginx/sites-enabled/
# Then: certbot --nginx -d sync.yourdomain.com

server {
    listen 80;
    server_name sync.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sync.yourdomain.com;

    # SSL — filled in automatically by certbot
    # ssl_certificate     /etc/letsencrypt/live/sync.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sync.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket proxy
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
    }
}
